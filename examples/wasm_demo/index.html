<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Orion to WebAssembly demo</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #cfd2e0;
           font-family: system-ui, sans-serif; display: flex;
           flex-direction: column; align-items: center; gap: 12px; padding: 24px; }
    h1 { font-size: 18px; font-weight: 600; margin: 0; }
    canvas { border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,.5); }
    #status { font-size: 13px; color: #7c8099; font-family: ui-monospace, monospace; }
    code { color: #8ac926; }
  </style>
</head>
<body>
  <h1>Orion &rarr; WebAssembly</h1>
  <canvas id="c" width="600" height="440"></canvas>
  <div id="status">loading&hellip;</div>
  <div style="font-size:12px;color:#565a70">
    <code>render(t)</code> runs in wasm; JS draws the circles.
  </div>
  <script src="main.js"></script>
</body>
</html>
