# The whole suite, on a machine that is not the author's laptop.
#
# Ubuntu is the honest fresh-clone signal and exercises the POSIX retarget path.
# Windows is where the work happens. macOS is the only arm64/Mach-O runner, and
# the only one with a tight main-thread stack.

name: green

# Manual for the author: a push does not need a runner to repeat what the gates
# already said on the machine that made the change. A PULL REQUEST is the other
# case entirely - it is code nobody here has run yet, so it is proven before it
# is read.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: green-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false   # one red platform must not hide the other's result
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        shell: bash   # Windows runners have Git Bash; every tool here is a bash script

    steps:
      - uses: actions/checkout@v5

      - name: toolchain
        run: clang --version && uname -s

      # From a bare checkout with no binary: exactly someone else's first clone.
      - name: seed builds the compiler
        run: bash tools/seed_check.sh

      - name: bootstrap from the seed
        run: bash tools/bootstrap.sh

      - name: errors that must stay errors
        run: bash tools/negative_test.sh

      - name: demos
        run: bash tools/demos_smoke.sh

      - name: feature combinations
        run: bash tools/combo_test.sh

      # Gates that need a project of their own, not a single file: the
      # deterministic certificate across a call graph, and the orb boundary.
      - name: png decoder
        run: bash tools/png_test.sh

      - name: project gates
        run: bash tools/project_test.sh

      - name: workspace layout resolution
        run: bash tools/test_workspace.sh

      - name: lsp
        run: bash tools/build_lsp.sh && bash tools/lsp_test.sh

      # Every `example` line in every orb compiles and runs as a claim.
      - name: stdlib examples run true
        run: bash tools/example_check.sh

      - name: package system
        run: bash tools/package_test.sh

      - name: debugger
        run: bash tools/debug_test.sh

      - name: vendored C links
        run: bash tools/link_test.sh

      - name: sqlite
        run: bash tools/sqlite_test.sh

      # Skips its device phase on a runner with no capture hardware.
      - name: mic capture
        run: bash tools/mic_test.sh

      # Skips itself when the runner has no model (they are not in the repo).
      - name: whisper
        run: bash tools/whisper_test.sh

      - name: field guide samples compile
        run: bash tools/docs_check.sh

      # A regression ratchet, not a 100% gate: the OK count must not drop.
      - name: wasm backend conformance
        run: bash tools/wasm_conformance.sh

      # Does a valid program still give the RIGHT ANSWER when something that
      # cannot matter is changed? Every wrong-answer bug so far lived there.
      - name: valid programs still answer correctly
        run: bash tools/value_check.sh

      - name: arena region shrink
        run: bash tools/region_shrink_test.sh

      # Reported, not gated: a runner is a different, slower machine, and a gate
      # that cries wolf gets ignored. The benches gate where the baseline was set.
      - name: compiler speed (reported)
        env: { GATE: '0' }
        run: bash tools/compile_bench.sh

      - name: generated-code speed (reported)
        env: { GATE: '0' }
        run: bash tools/runtime_bench.sh
