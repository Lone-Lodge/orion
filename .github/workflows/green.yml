# green.yml - the suite the repo already had, run somewhere that is not the
# author's laptop.
#
# The first job is the one that matters: it starts from a bare checkout with no
# binary, exactly like someone else's first clone. That is the case that broke
# silently before (the committed seed had rotted past the compiler source and
# nobody noticed, because everyday work reuses the dist/orion.exe you already
# have). seed_check runs first so a stale seed says so in one line instead of
# failing deep inside stage 1 of the bootstrap.
#
# Ubuntu is the honest fresh-clone signal: it also exercises the retarget path
# (the compiler always emits a Windows triple, so POSIX hosts rewrite the module
# header before clang links it) which nobody runs by hand. Windows is where the
# work happens, so it is here as the no-surprises job. macOS is the only runner
# that is arm64 and Mach-O: it rewrites the header to `e-m:o` with an
# arm64-apple triple and links under a main-thread stack the OS caps well below
# the others, so it is the one place the non-x86 target and the tight stack get
# exercised at all.

name: green

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A second push supersedes an in-flight run on the same ref.
concurrency:
  group: green-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One red platform must not hide the other's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        # Windows runners have Git Bash; every tool here is a bash script.
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: toolchain
        run: |
          clang --version
          uname -s

      # Before anything else: can a stranger build this at all?
      - name: seed builds the compiler
        run: bash tools/seed_check.sh

      # seed -> self-compile -> fixpoint -> orbit -> 151 smoke tests.
      - name: bootstrap from the seed
        run: bash tools/bootstrap.sh

      - name: negative (errors that must stay errors)
        run: bash tools/negative_test.sh

      - name: demos
        run: bash tools/demos_smoke.sh

      - name: feature combinations
        run: bash tools/combo_test.sh

      - name: workspace layout resolution
        run: bash tools/test_workspace.sh

      - name: lsp
        run: |
          bash tools/build_lsp.sh
          bash tools/lsp_test.sh

      # Every `example` line in every orb compiles and runs as a claim.
      - name: stdlib examples run true
        run: bash tools/example_check.sh

      # get / lock / transitive / update, against local git repos (no network).
      - name: package system
        run: bash tools/package_test.sh

      # call trail on trap, breakpoint() reporting, opt-in instrumentation.
      - name: debugger
        run: bash tools/debug_test.sh

      # `link = "vendor/x.c"` in Orbit.toml - the door to the C ecosystem.
      - name: vendored C links
        run: bash tools/link_test.sh

      # The sqlite orb over that door: create/insert/bind/query/error.
      - name: sqlite
        run: bash tools/sqlite_test.sh

      # Mic capture. The null-backend phase runs everywhere and proves the
      # binding chain; the WASAPI phase skips itself on a runner with no
      # capture device rather than failing the build.
      - name: mic capture
        run: bash tools/mic_test.sh

      # Speech to text over the vendored whisper.cpp. Skips itself when the
      # runner has no model (they are half a gigabyte and not in the repo),
      # so this gates the wiring on every push and the recognition locally.
      - name: whisper
        run: bash tools/whisper_test.sh

      # A documented feature that no longer exists fails exactly like a stale
      # seed: it reads fine and nobody runs it. Every sample in the Field Guide
      # is a whole program, and this compiles all of them.
      - name: field guide samples compile
        run: bash tools/docs_check.sh

      # The wasm backend is secondary and does not cover every feature, so this
      # is a REGRESSION gate, not a 100% gate: the OK count must not drop and
      # there must be no unexpected wrong-answer/crash (known gaps are allowlisted
      # in wasm_conformance.js). Needs node, which the runners already have.
      - name: wasm backend conformance
        run: bash tools/wasm_conformance.sh

      # Everything above this line asks whether the compiler crashes, refuses
      # correctly, or runs fast. This asks whether a valid program still gives
      # the RIGHT ANSWER when something that cannot matter is changed. Every
      # wrong-answer bug found so far lived in that gap.
      - name: valid programs still answer correctly
        run: bash tools/value_check.sh

      - name: arena region shrink
        run: bash tools/region_shrink_test.sh

      # GATE=0: report the numbers, do not fail on them. Both baselines are wall
      # clock recorded on one machine, and a runner is simply a different, slower
      # machine -- best-of-3 does not fix that. Gating on it would mean a red
      # build for hardware, and a gate that cries wolf gets ignored. The benches
      # still gate where the baseline was recorded; here they are a trend line.
      - name: compiler speed (reported)
        env: { GATE: '0' }
        run: bash tools/compile_bench.sh

      - name: generated-code speed (reported)
        env: { GATE: '0' }
        run: bash tools/runtime_bench.sh

      # The tracked .ll under examples/tests/dist is the compiler's own output,
      # so a codegen change that forgets to regenerate it shows up here as a
      # diff. Informational: the suite above is the real gate.
      - name: committed IR still matches what the compiler emits
        if: always()
        run: |
          if ! git diff --quiet -- examples/tests/dist; then
            echo "::warning::committed IR under examples/tests/dist differs from this build's output"
            git diff --stat -- examples/tests/dist | tail -5
          else
            echo "committed IR matches"
          fi
