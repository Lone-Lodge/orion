# Orion — a next-gen, intent-driven, data-oriented systems language.
# See ORION.md for the full design. This crate is the compiler, written in Rust
# (Rust is the scaffolding, not a ceiling — see ORION.md §"hönan och ägget").
#
# M0 = lexer + token vocabulary. The pipeline mirrors astra's proven shape:
#   source text -> lex -> (parse -> check -> codegen, added in later milestones).
[package]
name = "orion-lang"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Orion: a next-gen, intent-driven, data-oriented systems language."
# `cargo run` defaults to the `orion` CLI (so you don't need `--bin orion`).
default-run = "orion"

# The language IS "orion": the import (`use orion::lex`) and file extension (`.or`).
[lib]
name = "orion"

# A tiny CLI so you can SEE the compiler stages: `cargo run -- examples/hello.or`.
[[bin]]
name = "orion"
path = "src/main.rs"

# `orbit` — the project tool (Cargo-equivalent): new / build / run / test / fmt.
[[bin]]
name = "orbit"
path = "src/bin/orbit.rs"

# `orion-lsp` — the Language Server (LSP over stdio). Point your editor here.
[[bin]]
name = "orion-lsp"
path = "src/bin/orion-lsp.rs"

[dependencies]
# Faster non-cryptographic hash for HashMap — std SipHash dominates
# the interpreter's variable-lookup hot path; rustc-hash drops it
# 2-3× for short string keys.
rustc-hash = "2"
# Work-stealing thread pool for `parallel for` / `parallel_each`. The
# scheduler runs each iteration on whichever core is free; closures
# need to be Send (Closure body/captured are `Arc`).
rayon = "1"
cranelift = "0.133.0"
cranelift-jit = "0.133.0"
cranelift-module = "0.133.0"
cranelift-native = "0.133.0"
cranelift-object = "0.133"
# Blocking HTTP client for `net` orb — minimal, no async runtime.
ureq = "2"

# Platform-binding deps used by stdlib orbs. Keep this list curated and
# justified — every dep here ships with `orbit` to every user's project.
png = "0.17"   # `image` orb — PNG decode/encode, pure-Rust via miniz_oxide
cpal = "0.15"  # `audio` orb — cross-platform audio output (WASAPI/CoreAudio/ALSA)

# `window` + `gpu` orbs — raw OS FFI, no winit/wgpu deps. Just type
# definitions and link-time bindings. windows-sys is the canonical
# zero-cost FFI layer.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
] }
# `gpu` orb D3D12 backend lives here. The `windows` crate (not -sys)
# is the one with the COM-aware D3D12 interfaces ergonomic enough to
# call without hand-rolling vtables.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
] }
